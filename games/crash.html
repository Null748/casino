
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Null Casino - Crash</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #080a0d;
    --panel: rgba(15, 19, 25, .92);
    --border: #252b33;
    --cyan: #00ffcc;
    --purple: #7b2cff;
    --red: #ff405d;
    --green: #00ff9d;
    --muted: #78818e;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 5%, rgba(0,255,204,.09), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(123,44,255,.12), transparent 32%),
        var(--bg);
    color: white;
    font-family: 'Orbitron', sans-serif;
    padding: 25px;
}

button, input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: var(--cyan);
}

.status {
    color: var(--green);
    font-size: 10px;
    letter-spacing: 2px;
}

.status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 10px var(--green);
}

.topbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 18px;
    flex: 1;
    min-width: 145px;
}

.stat-label {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 19px;
    font-weight: 700;
}

.game-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,.25);
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 17px 20px;
    border-bottom: 1px solid var(--border);
}

.game-title {
    font-size: 12px;
    letter-spacing: 3px;
}

.round-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
}

.graph-area {
    height: 390px;
    position: relative;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 40px 40px;
    overflow: hidden;
}

#graph {
    width: 100%;
    height: 100%;
    display: block;
}

.multiplier-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 2;
}

.multiplier {
    font-size: clamp(48px, 9vw, 85px);
    font-weight: 900;
    letter-spacing: -3px;
    color: white;
    text-shadow: 0 0 25px rgba(0,255,204,.25);
    transition: color .15s;
}

.multiplier.running {
    color: var(--cyan);
    text-shadow: 0 0 25px rgba(0,255,204,.4);
}

.multiplier.crashed {
    color: var(--red);
    text-shadow: 0 0 25px rgba(255,64,93,.5);
}

.multiplier.cashed {
    color: var(--green);
    text-shadow: 0 0 25px rgba(0,255,157,.5);
}

.game-message {
    margin-top: 10px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
    text-align: center;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    padding: 20px;
}

.control-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 17px;
    background: rgba(0,0,0,.18);
}

.control-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 12px;
}

.bet-row {
    display: flex;
    gap: 8px;
}

.small-btn {
    width: 42px;
    min-width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #11161d;
    color: white;
    font-size: 18px;
    transition: .2s;
}

.small-btn:hover:not(:disabled) {
    border-color: var(--cyan);
    color: var(--cyan);
}

.bet-input {
    width: 100%;
    min-width: 0;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #080b10;
    color: white;
    padding: 0 12px;
    font-size: 15px;
    outline: none;
}

.bet-input:focus {
    border-color: var(--cyan);
}

.auto-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
}

.auto-row label {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 1px;
}

.auto-input {
    width: 80px;
    height: 30px;
    background: #080b10;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: white;
    padding: 0 8px;
    outline: none;
    font-size: 11px;
}

.main-btn {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #06110f;
    background: var(--cyan);
    box-shadow: 0 0 20px rgba(0,255,204,.16);
    transition: .2s;
}

.main-btn:hover:not(:disabled) {
    box-shadow: 0 0 30px rgba(0,255,204,.35);
    transform: translateY(-1px);
}

.main-btn.cashout {
    background: var(--green);
    color: #04130b;
    animation: pulse 1s infinite alternate;
}

.main-btn:disabled {
    background: #303943;
    color: #87919c;
    box-shadow: none;
    transform: none;
}

@keyframes pulse {
    from { box-shadow: 0 0 8px rgba(0,255,157,.15); }
    to { box-shadow: 0 0 25px rgba(0,255,157,.45); }
}

.recent-section {
    padding: 0 20px 20px;
}

.section-heading {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.recent-results {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.result-pill {
    padding: 9px 12px;
    border-radius: 6px;
    background: #11161d;
    border: 1px solid var(--border);
    color: var(--red);
    font-size: 10px;
}

.result-pill.good {
    color: var(--green);
    border-color: rgba(0,255,157,.2);
}

.result-pill.mid {
    color: #ffcc66;
    border-color: rgba(255,204,102,.2);
}

footer {
    text-align: center;
    color: #414a55;
    font-size: 9px;
    letter-spacing: 3px;
    margin-top: 25px;
}

@media(max-width: 650px) {
    body { padding: 14px; }
    .controls { grid-template-columns: 1fr; padding: 13px; }
    .graph-area { height: 310px; }
    .game-header { padding: 14px; }
    .recent-section { padding: 0 13px 15px; }
    .stat { padding: 11px; }
    .stat-value { font-size: 16px; }
    header { margin-bottom: 18px; }
}

</style>
</head>

<body>
<div class="container">

    <header>
        <div class="logo">NULL <span>CASINO</span></div>
        <div class="status">SYSTEM ONLINE</div>
    </header>

    <div class="topbar">
        <div class="stat">
            <div class="stat-label">BALANCE</div>
            <div class="stat-value" id="balance">$1,000.00</div>
        </div>
        <div class="stat">
            <div class="stat-label">TOTAL WON</div>
            <div class="stat-value" id="totalWon">$0.00</div>
        </div>
        <div class="stat">
            <div class="stat-label">CURRENT BET</div>
            <div class="stat-value" id="currentBet">$10.00</div>
        </div>
    </div>

    <main class="game-panel">
        <div class="game-header">
            <div class="game-title">CRASH // V.01</div>
            <div class="round-label" id="roundLabel">WAITING FOR ROUND</div>
        </div>

        <div class="graph-area">
            <canvas id="graph"></canvas>

            <div class="multiplier-display">
                <div class="multiplier" id="multiplier">1.00x</div>
                <div class="game-message" id="gameMessage">PLACE YOUR BET TO BEGIN</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-box">
                <div class="control-label">YOUR BET</div>

                <div class="bet-row">
                    <button class="small-btn" id="decreaseBet">−</button>
                    <input class="bet-input" id="betInput" type="number"
                        min="1" max="1000" step="1" value="10">
                    <button class="small-btn" id="increaseBet">+</button>
                </div>

                <div class="auto-row">
                    <label for="autoInput">AUTO CASH OUT AT</label>
                    <input class="auto-input" id="autoInput" type="number"
                        min="1.01" max="1000" step=".01" placeholder="OFF">
                    <span style="color:var(--muted);font-size:9px;">x</span>
                </div>
            </div>

            <div class="control-box">
                <div class="control-label">GAME CONTROL</div>
                <button class="main-btn" id="mainButton">START ROUND</button>
            </div>
        </div>

        <div class="recent-section">
            <div class="section-heading">RECENT CRASHES</div>
            <div class="recent-results" id="recentResults">
                <span class="result-pill">NO RESULTS YET</span>
            </div>
        </div>
    </main>

    <footer>NULL CASINO // 2026</footer>
</div>

<script>
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

const balanceDisplay = document.getElementById("balance");
const totalWonDisplay = document.getElementById("totalWon");
const currentBetDisplay = document.getElementById("currentBet");
const multiplierDisplay = document.getElementById("multiplier");
const gameMessage = document.getElementById("gameMessage");
const roundLabel = document.getElementById("roundLabel");
const mainButton = document.getElementById("mainButton");
const betInput = document.getElementById("betInput");
const autoInput = document.getElementById("autoInput");
const recentResults = document.getElementById("recentResults");

let balance = 1000;
let totalWon = 0;
let bet = 10;

let running = false;
let cashedOut = false;
let crashed = false;

let currentMultiplier = 1;
let crashPoint = 1;
let startTime = 0;
let animationFrame = null;
let history = [];
let roundNumber = 0;

let audioContext = null;

function money(value) {
    return "$" + value.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function updateDisplays() {
    balanceDisplay.textContent = money(balance);
    totalWonDisplay.textContent = money(totalWon);
    currentBetDisplay.textContent = money(bet);

    betInput.max = balance;
}

function clampBet(value) {
    return Math.max(1, Math.min(balance, Math.floor(value || 1)));
}

function setBet(value) {
    if (running) return;

    bet = clampBet(value);
    betInput.value = bet;
    updateDisplays();
}

document.getElementById("decreaseBet").addEventListener("click", () => {
    setBet(bet - 10);
});

document.getElementById("increaseBet").addEventListener("click", () => {
    setBet(bet + 10);
});

betInput.addEventListener("change", () => {
    setBet(Number(betInput.value));
});

betInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        betInput.blur();
    }
});

function sound(frequency, duration, type = "sine", volume = .05) {
    try {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
    } catch (error) {
        // Sound is optional if the browser does not support Web Audio.
    }
}

function playCrashSound() {
    sound(180, .4, "sawtooth", .09);
    setTimeout(() => sound(85, .55, "sawtooth", .07), 100);
}

function playCashoutSound() {
    sound(600, .12, "sine", .06);
    setTimeout(() => sound(850, .2, "sine", .06), 100);
}

function generateCrashPoint() {
    // A randomized crash point with a small house edge.
    const random = Math.random();

    if (random < .01) return 1.00;

    const point = .99 / (1 - random);
    return Math.max(1.00, Math.floor(point * 100) / 100);
}

function startRound() {
    if (running || balance < bet || bet < 1) return;

    balance -= bet;
    updateDisplays();

    roundNumber++;
    crashPoint = generateCrashPoint();
    currentMultiplier = 1;
    startTime = performance.now();

    running = true;
    cashedOut = false;
    crashed = false;

    history = [{ x: 0, y: 1 }];

    multiplierDisplay.textContent = "1.00x";
    multiplierDisplay.className = "multiplier running";

    gameMessage.textContent = "GOOD LUCK...";
    roundLabel.textContent = "ROUND #" + roundNumber;

    mainButton.textContent = "CASH OUT";
    mainButton.className = "main-btn cashout";
    mainButton.disabled = false;

    betInput.disabled = true;
    document.getElementById("increaseBet").disabled = true;
    document.getElementById("decreaseBet").disabled = true;

    sound(440, .12, "sine", .04);

    drawGraph();
    animationFrame = requestAnimationFrame(updateGame);
}

function updateGame(now) {
    if (!running) return;

    const elapsed = now - startTime;

    // Smooth exponential multiplier growth.
    currentMultiplier = Math.exp(elapsed * .00012);
    currentMultiplier = Math.max(1, currentMultiplier);

    history.push({
        x: elapsed,
        y: currentMultiplier
    });

    multiplierDisplay.textContent = currentMultiplier.toFixed(2) + "x";

    // Automatic cash out.
    const autoTarget = Number(autoInput.value);

    if (
        !cashedOut &&
        autoInput.value.trim() !== "" &&
        Number.isFinite(autoTarget) &&
        autoTarget >= 1.01 &&
        currentMultiplier >= autoTarget
    ) {
        cashOut();
    }

    // Crash check.
    if (currentMultiplier >= crashPoint) {
        currentMultiplier = crashPoint;
        multiplierDisplay.textContent = crashPoint.toFixed(2) + "x";
        crashGame();
        return;
    }

    drawGraph();
    animationFrame = requestAnimationFrame(updateGame);
}

function cashOut() {
    if (!running || cashedOut) return;

    cashedOut = true;

    const payout = bet * currentMultiplier;
    balance += payout;
    totalWon += payout;

    updateDisplays();

    multiplierDisplay.className = "multiplier cashed";
    gameMessage.textContent = "CASHED OUT: +" + money(payout);

    mainButton.textContent = "BET AGAIN";
    mainButton.className = "main-btn";
    mainButton.disabled = true;

    playCashoutSound();

    // The round continues until the crash, but the player is safe.
}

function crashGame() {
    if (!running) return;

    running = false;
    crashed = true;

    cancelAnimationFrame(animationFrame);

    multiplierDisplay.className = cashedOut
        ? "multiplier cashed"
        : "multiplier crashed";

    if (cashedOut) {
        gameMessage.textContent = "YOU ESCAPED THE CRASH!";
    } else {
        gameMessage.textContent = "YOU LOST " + money(bet);
    }

    roundLabel.textContent = "CRASHED AT " + crashPoint.toFixed(2) + "x";

    if (!cashedOut) {
        playCrashSound();
    }

    mainButton.textContent = "START NEXT ROUND";
    mainButton.className = "main-btn";
    mainButton.disabled = balance < 1;

    enableBetControls();
    addRecentResult(crashPoint);

    drawGraph();
}

function enableBetControls() {
    betInput.disabled = false;
    document.getElementById("increaseBet").disabled = false;
    document.getElementById("decreaseBet").disabled = false;

    setBet(Math.min(bet, balance));
}

function addRecentResult(value) {
    const pill = document.createElement("span");
    pill.className = "result-pill";

    if (value >= 2) {
        pill.classList.add("good");
    } else if (value >= 1.5) {
        pill.classList.add("mid");
    }

    pill.textContent = value.toFixed(2) + "x";

    if (recentResults.children.length === 1 &&
        recentResults.textContent === "NO RESULTS YET") {
        recentResults.innerHTML = "";
    }

    recentResults.prepend(pill);

    while (recentResults.children.length > 12) {
        recentResults.removeChild(recentResults.lastChild);
    }
}

mainButton.addEventListener("click", () => {
    if (!running) {
        startRound();
    } else if (!cashedOut) {
        cashOut();
    }
});

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawGraph();
}

function drawGraph() {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    if (!width || !height) return;

    ctx.clearRect(0, 0, width, height);

    const padding = 35;
    const bottom = height - padding;
    const left = padding;
    const right = width - padding;
    const top = padding;

    // Grid.
    ctx.strokeStyle = "rgba(255,255,255,.045)";
    ctx.lineWidth = 1;

    for (let x = left; x <= right; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);
        ctx.stroke();
    }

    for (let y = top; y <= bottom; y += 40) {
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
        ctx.stroke();
    }

    // Axis baseline.
    ctx.strokeStyle = "rgba(255,255,255,.15)";
    ctx.beginPath();
    ctx.moveTo(left, bottom);
    ctx.lineTo(right, bottom);
    ctx.stroke();

    if (!history.length) return;

    const maxMultiplier = Math.max(2, currentMultiplier * 1.15);
    const maxTime = Math.max(
        5000,
        history[history.length - 1].x * 1.15
    );

    const points = history.map(point => ({
        x: left + (point.x / maxTime) * (right - left),
        y: bottom - ((point.y - 1) / (maxMultiplier - 1)) * (bottom - top)
    }));

    // Filled area beneath the curve.
    const fill = ctx.createLinearGradient(0, top, 0, bottom);
    fill.addColorStop(0, "rgba(0,255,204,.22)");
    fill.addColorStop(1, "rgba(0,255,204,0)");

    ctx.beginPath();
    ctx.moveTo(points[0].x, bottom);
    ctx.lineTo(points[0].x, points[0].y);

    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
    }

    ctx.lineTo(points[points.length - 1].x, bottom);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();

    // Main curve.
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);

    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
    }

    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = crashed && !cashedOut ? "#ff405d" : "#00ffcc";
    ctx.shadowColor = crashed && !cashedOut ? "#ff405d" : "#00ffcc";
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Current position glow.
    const last = points[points.length - 1];

    ctx.beginPath();
    ctx.arc(last.x, last.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = crashed && !cashedOut ? "#ff405d" : "#00ffcc";
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
}

window.addEventListener("resize", resizeCanvas);

updateDisplays();
resizeCanvas();
</script>
</body>
</html>
