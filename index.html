
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Null Casino</title>
<link rel="icon" type="image/x-icon" href="https://chatgpt.com/s/m_6ae3e9c9de788191b247435a434618d8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080a0d;
    color: white;
    font-family: 'Orbitron', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Background glow */

body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: #00ffcc;
    filter: blur(180px);
    opacity: 0.055;
    top: -300px;
    left: -200px;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: #7b2cff;
    filter: blur(180px);
    opacity: 0.07;
    bottom: -300px;
    right: -150px;
    pointer-events: none;
}

/* Main container */

.container {
    text-align: center;
    width: 90%;
    max-width: 650px;
    position: relative;
    z-index: 1;
}

.subtitle {
    color: #00ffcc;
    font-size: 10px;
    letter-spacing: 6px;
    margin-bottom: 18px;
    text-transform: uppercase;
    opacity: 0.8;
}

h1 {
    font-size: clamp(36px, 8vw, 65px);
    font-weight: 800;
    letter-spacing: 3px;
    color: white;
    text-shadow:
        0 0 10px rgba(0,255,204,0.5),
        0 0 30px rgba(0,255,204,0.2);
    margin-bottom: 12px;
}

.description {
    color: #777f8c;
    font-family: Arial, sans-serif;
    font-size: 14px;
    margin-bottom: 48px;
}

/* Buttons */

.buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.game-button {
    position: relative;
    display: block;
    padding: 21px;
    border: 1px solid #252b33;
    background: rgba(255,255,255,0.025);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    overflow: hidden;
    transition: 0.35s ease;
    border-radius: 5px;
}

/* Roulette - green glow */

.roulette:hover {
    border-color: #00ff99;
    color: #00ff99;
    background: rgba(0,255,153,0.06);
    box-shadow:
        0 0 10px rgba(0,255,153,0.3),
        0 0 35px rgba(0,255,153,0.12),
        inset 0 0 15px rgba(0,255,153,0.05);
    transform: scale(1.025);
}

/* RNGdle - purple sweep */

.rngdle::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        110deg,
        transparent,
        rgba(160,80,255,0.25),
        transparent
    );
    transition: 0.6s;
}

.rngdle:hover::before {
    left: 120%;
}

.rngdle:hover {
    border-color: #a855ff;
    color: #c58aff;
    box-shadow: 0 0 25px rgba(168,85,255,0.2);
}

/* Third game - red pulse */

.extra:hover {
    border-color: #ff416c;
    color: #ff416c;
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from {
        box-shadow: 0 0 5px rgba(255,65,108,0.1);
    }
    to {
        box-shadow: 0 0 22px rgba(255,65,108,0.4);
    }
}

/* Footer */

.footer {
    margin-top: 45px;
    color: #414853;
    font-size: 9px;
    letter-spacing: 3px;
}

.status {
    color: #00ff99;
    margin-top: 12px;
    font-size: 9px;
    letter-spacing: 2px;
}

.status::before {
    content: "●";
    margin-right: 8px;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { opacity: 0.2; }
}

@media (max-width: 500px) {
    .description {
        font-size: 12px;
    }

    .game-button {
        padding: 19px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="subtitle">Made by Null and Others</div>

    <h1>CASINO.</h1>

    <p class="description">
        Welcome. Choose your game.
    </p>

    <div class="buttons">

        <a href="/games/roulette.html" class="game-button roulette">
            ROULETTE
        </a>

        <a href="/games/rngdle/index.html" class="game-button rngdle">
            RNGDLE
        </a>

        <a href="/games/blackjack.html" class="game-button extra">
            BLACKJACK
        </a>

    </div>

    <div class="footer">
        NULL CASINO &nbsp; // &nbsp; 2026
    </div>

    <div class="status">
        SYSTEM ONLINE
    </div>
    <div class="footer">
    Made for PC
    </div>
</div>
    
</body>
</html>
